[project]
name = "pvzwm"
version = "0.1.0"
description = "World-model and reinforcement-learning research platform for Plants vs. Zombies"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-only"
dependencies = [
    "av>=18.0.0",
    "duckdb>=1.4.0",
    "numpy>=2.2.0",
    "plants-vs-zombies==0.0.5",
    "torch>=2.7.0",
    "torchvision>=0.28.0",
]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]

[project.optional-dependencies]
live = [
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
]

[project.scripts]
pvzwm = "pvzwm.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pvzwm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E731"]
